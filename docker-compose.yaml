version: '3.8'

services:
  bingenie:
    build: .
    container_name: bingenie_app
    ports:
      - "8001:8001"
    environment:
      SECRET_KEY: "super-secure-key"
      FLASK_APP: "run.py"
      FLASK_RUN_HOST: "0.0.0.0"
      DATABASE_USER: "nathan"
      DATABASE_PASSWORD: "Robert19940"
      # The production config uses the host 'postgres' for the database container.
      # Your SQLALCHEMY_DATABASE_URI in ProductionConfig will become:
      # postgresql://nathan:Robert19940@postgres/bin_genie_database
      UPLOAD_FOLDER: "/app/uploads"
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads

  postgres:
    image: postgres:13-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: "nathan"
      POSTGRES_PASSWORD: "Robert19940"
      POSTGRES_DB: "bin_genie_database"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
